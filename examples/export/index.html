<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F3EBDD">
    <title>Тихая типография — пример экспорта</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main>
      <article class="page-preview" tabindex="-1" data-template="note">
        <p class="page-overline">Заметка · STATIC STUDIO</p>
        <h1 class="preview-block preview-heading">Тихая типография</h1>
        <p class="preview-block preview-text">Небольшая статичная страница, собранная в Static Studio. Текст, изображение и ссылка живут рядом в одном локальном наборе файлов.</p>
        <hr class="preview-block preview-rule">
        <p class="preview-block preview-text">Откройте этот файл напрямую: рядом лежат только таблица стилей и картинка из папки <code>assets/</code>.</p>
        <figure class="preview-block preview-image">
          <img src="assets/placeholder.svg" alt="Абстрактная бумажная композиция" loading="lazy">
          <figcaption class="page-caption">01 — Локальный asset из экспортной папки</figcaption>
        </figure>
        <p class="preview-block preview-link"><a href="https://example.com" target="_blank" rel="noopener noreferrer">Открыть пример ссылки</a></p>
      </article>
    </main>
  </body>
</html>

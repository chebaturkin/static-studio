<!doctype html>
<html lang="en">
<head>
  <base href="/static-studio/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="notFound.title">page not found | static studio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <style>
    main { min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    article { width: min(100%, 540px); padding: clamp(28px, 6vw, 48px); border: 1px solid var(--ui-line); border-radius: 24px; background: var(--ui-surface); }
    h1 { margin: 20px 0 16px; font-size: clamp(28px, 6vw, 40px); font-weight: 500; letter-spacing: -.04em; line-height: 1.15; }
    p { margin-bottom: 28px; color: var(--ui-muted); font-size: 15px; }
    .overline { color: var(--ui-accent); font-size: 13px; }
    a { text-decoration: none; }
  </style>
</head>
<body><main><article><span class="overline">static studio · 404</span><h1 data-i18n="notFound.heading">page not found</h1><p data-i18n="notFound.body">check the address or return to the editor to continue your work.</p><a class="button button-accent" href="./" data-i18n="notFound.link">open the editor</a></article></main></body>
<script src="i18n.js"></script>
<script>
  const home = document.querySelector('article a');
  const url = new URL(home.href);
  url.searchParams.set('lang', I18n.locale);
  home.href = url.href;
</script>
</html>
